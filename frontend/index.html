<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroLens | AI Medical Imaging Analysis</title>

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#63b1ff;
    --secondary:#29598b;
    --tertiary:#0a37d8;

    --accent-cyan:#256797;
    --accent-magenta:#04548e;
    --accent-purple:#012f75;
    --accent-green:#17c7a3;

    --text-primary:#12324a;
    --text-secondary:#5f7d95;

    --glass-light:rgba(255,255,255,0.75);
    --glass-border:rgba(0, 134, 230, 0.899);
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(
        135deg,
        #f7fbff 0%,
        #8ec5f5 25%,
        #3a698e 55%,
        #44a1e8 100%
    );
    background-attachment:fixed;
    color:var(--text-primary);
    overflow:hidden;
}

/* animated background */
body::before{
    content:'';
    position:fixed;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:
        radial-gradient(circle at 20% 50%, rgba(42,167,255,0.10) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(124,200,255,0.12) 0%, transparent 45%),
        radial-gradient(circle at 40% 20%, rgba(91,157,255,0.08) 0%, transparent 45%);
    animation:drift 20s ease-in-out infinite;
    pointer-events:none;
    z-index:1;
}

@keyframes drift{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(50px,100px);}
}

.app-shell{
    display:flex;
    height:100vh;
    gap:2px;
    position:relative;
    z-index:10;
}

/* sidebar */
.sidebar{
    width:280px;
    background:linear-gradient(
        180deg,
        rgba(255,255,255,0.95) 0%,
        rgba(234,244,255,0.92) 100%
    );
    border-right:1px solid rgba(42,167,255,0.12);
    display:flex;
    flex-direction:column;
    padding:40px 0;
    animation:slideInLeft .6s ease-out;
}

@keyframes slideInLeft{
    from{
        opacity:0;
        transform:translateX(-100px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.logo{
    font-size:34px;
    font-weight:900;
    text-align:center;
    margin-bottom:60px;
    background:linear-gradient(135deg,#3a698e,#44a1e8,#8ec5f5);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:3px;
    text-transform:uppercase;
}

nav{
    display:flex;
    flex-direction:column;
    gap:20px;
    padding:0 20px;
    justify-content:center;   /* vertical center */
    align-items:center;       /* horizontal center */
    flex:0.8;
}

.sidebar-links{
        margin:20px 20px 0;
        margin-top:auto;
        gap:8px;
        width:100%;
        align-items:flex-start;
    }

    .sidebar-link{
        display:block;
        padding:10px 0;
        text-decoration:none;
        text-align:left;
        font-weight:700;
        font-size:15px;
        color:var(--accent-cyan);
        background:none;
        border:none;
        width:auto;
        max-width:220px;
        margin:0;
    }
.nav-item{
    padding:16px 20px;
    background:rgba(42,167,255,0.05);
    border:1px solid rgba(42,167,255,0.18);
    border-radius:12px;
    color:var(--text-secondary);
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1px;
    transition:.3s;
}

.nav-item:hover{
    background:rgba(42,167,255,0.10);
    border-color:var(--accent-cyan);
    color:var(--accent-cyan);
    transform:translateX(8px);
    box-shadow:0 0 18px rgba(42,167,255,0.15);
}

.nav-item.active{
    background:rgba(42,167,255,0.14);
    border-color:var(--accent-cyan);
    color:var(--accent-cyan);
}

/* main */
.viewport{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    padding:40px;
}

.upload-zone{
    width:100%;
    height:100%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.upload-zone::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(42,167,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42,167,255,0.05) 1px, transparent 1px);
    background-size:50px 50px;
    animation:moveGrid 20s linear infinite;
}

@keyframes moveGrid{
    from{transform:translate(0,0);}
    to{transform:translate(50px,50px);}
}

.scan-line{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(42,167,255,0.8),
        transparent
    );
    animation:scanLine 3s linear infinite;
}

.logo{
    
    font-size:32px;
    font-weight:900;
    text-align:center;
    margin-bottom:10px;
    background:linear-gradient(135deg,#1f8fff,#58b6ff,#89d1ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:3px;
    text-transform:uppercase;
}
.logo img{
    width:130px;     
    max-width:90%;
    height:auto;
    object-fit:contain;
    filter:drop-shadow(0 10px 25px rgba(42,167,255,0.28));
    transition:0.3s ease;
}
@keyframes scanLine{
    from{transform:translateY(0);}
    to{transform:translateY(100vh);}
}

.upload-prompt{
    position:relative;
    z-index:5;
    text-align:center;
    background:linear-gradient(
        135deg,
        rgba(255,255,255,0.92) 0%,
        rgba(206, 226, 247, 0.95) 100%
    );
    border:1px solid rgba(42,167,255,0.14);
    padding:80px 100px;
    border-radius:20px;
    max-width:700px;
    box-shadow:
        0 20px 40px rgba(42, 166, 255, 0.29),
        inset 0 0 20px rgba(255,255,255,0.7);
}

.tech-text{
    display:block;
    font-size:14px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--accent-cyan);
    margin-bottom:30px;
    font-weight:700;
}

.upload-prompt p{
    font-size:28px;
    font-weight:300;
    letter-spacing:2px;
    margin-bottom:20px;
}

.upload-prompt small{
    color:var(--text-secondary);
    font-size:14px;
}

.upload-prompt::after{
    display:none;
}

.upload-prompt.loading::after{
    content:'';
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    width:55px;
    height:55px;
    border:3px solid #cfe8ff;
    border-top-color:var(--accent-cyan);
    border-radius:50%;
    animation:spin 2s linear infinite;
}

@keyframes spin{
    to{transform:translateX(-50%) rotate(360deg);}
}

.particle{
    position:absolute;
    width:4px;
    height:4px;
    background:var(--accent-cyan);
    border-radius:50%;
    opacity:.5;
    animation:floatParticle 4s ease-in-out infinite;
}

@keyframes floatParticle{
    0%{transform:translateY(0);opacity:0;}
    20%{opacity:.5;}
    80%{opacity:.5;}
    100%{transform:translateY(-200px) translateX(100px);opacity:0;}
}

/* responsive */
@media(max-width:768px){

    .app-shell{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        padding:20px 0;
    }

    .viewport{
        padding:20px;
    }

    .upload-prompt{
        padding:50px 30px;
    }

    .upload-prompt p{
        font-size:20px;
    }
}

</style>
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">
        <div class="logo img">
        <img src="logo.png" alt="NeuroLens Logo">
        </div>
        <div class="logo">NeuroLens</div>

        <nav>
            <button class="nav-item active">TUMOR DETECT</button>
            <button class="nav-item">STROKE DETECT</button>
            <button class="nav-item">ALZHEIMER DETECT</button>
        </nav>
        <div class="sidebar-links">
            <a class="sidebar-link" href="faq.html">FAQ</a>
            <a class="sidebar-link" href="contact.html">Contact</a>
        </div>
    </aside>

    <main class="viewport">

        <div class="upload-zone">

            <div class="scan-line"></div>

            <div class="upload-prompt" id="uploadPrompt">
                <span class="tech-text">AI MEDICAL SYSTEM READY</span>

                <p>UPLOAD MRI SCAN</p>

                <small>Drop PNG / JPG / DICOM files or click to browse</small>
            </div>

        </div>

        <input type="file" id="fileInput" style="display:none;" accept="image/*">

    </main>

</div>

<script>
function createParticles(){
    const viewport=document.querySelector('.viewport');

    for(let i=0;i<15;i++){
        const p=document.createElement('div');
        p.className='particle';
        p.style.left=Math.random()*100+'%';
        p.style.top='100%';
        p.style.animationDelay=Math.random()*4+'s';
        p.style.animationDuration=(3+Math.random()*3)+'s';
        viewport.appendChild(p);
    }
}

// Handle nav items - now they navigate to results if available
document.querySelectorAll('.nav-item').forEach((btn, index)=>{
    btn.addEventListener('click', e => {
        const allResults = JSON.parse(sessionStorage.getItem('allResults') || '{}');
        if (!allResults.results) {
            alert('Please upload an MRI scan first');
            return;
        }
        
        // Store specific result for the page
        let resultKey = 'tumor';
        let page = 'brainTumor.html';
        if (index === 1) {
            resultKey = 'stroke';
            page = 'brainStrock.html';
        } else if (index === 2) {
            resultKey = 'alzheimer';
            page = 'alzheimer.html';
        }
        
        const specificResult = allResults.results[resultKey];
        if (specificResult && !specificResult.error) {
            sessionStorage.setItem('detectionResult', JSON.stringify(specificResult));
            sessionStorage.setItem('uploadedImageData', sessionStorage.getItem('uploadedImageData'));
            window.location.href = page;
        } else {
            alert(`Error loading ${resultKey} results: ${specificResult?.error || 'No results available'}`);
        }
    });
});

// Handle file input
const fileInput = document.getElementById('fileInput');
const uploadPrompt = document.getElementById('uploadPrompt');
const uploadZone = document.querySelector('.upload-zone');
let analysisComplete = false;

// Click to upload or refresh for new scan
uploadPrompt.addEventListener('click', () => {
    if (analysisComplete) {
        sessionStorage.removeItem('allResults');
        sessionStorage.removeItem('uploadedImageData');
        window.location.reload();
        return;
    }
    fileInput.click();
});

// File selected
fileInput.addEventListener('change', (e) => {
    if(e.target.files.length > 0){
        handleImageUpload(e.target.files[0]);
    }
});

// Drag and drop
uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadPrompt.style.transform = 'scale(0.98)';
    uploadPrompt.style.boxShadow = '0 20px 60px rgba(42, 166, 255, 0.4)';
});

uploadZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    uploadPrompt.style.transform = 'scale(1)';
    uploadPrompt.style.boxShadow = '0 20px 40px rgba(42, 166, 255, 0.29), inset 0 0 20px rgba(255,255,255,0.7)';
});

uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadPrompt.style.transform = 'scale(1)';
    uploadPrompt.style.boxShadow = '0 20px 40px rgba(42, 166, 255, 0.29), inset 0 0 20px rgba(255,255,255,0.7)';
    
    if(e.dataTransfer.files.length > 0){
        handleImageUpload(e.dataTransfer.files[0]);
    }
});

// Upload handler
async function handleImageUpload(file){
    // Validate file
    if(!file.type.startsWith('image/')){
        alert('❌ Please upload an image file (PNG, JPG, JPEG, GIF, BMP)');
        return;
    }

    if(file.size > 50 * 1024 * 1024) { // 50MB limit
        alert('❌ File is too large. Maximum size is 50MB');
        return;
    }

    // Show loading state
    uploadPrompt.innerHTML = '<div style="font-size:18px; font-weight:600;">⏳ Analyzing MRI Scan with all models...</div>';
    uploadPrompt.style.pointerEvents = 'none';
    uploadPrompt.style.opacity = '0.7';
    uploadPrompt.classList.add('loading');

    // Read image as base64 for display
    const reader = new FileReader();
    reader.onload = async (e) => {
        const imageData = e.target.result;

        // Prepare form data
        const formData = new FormData();
        formData.append('image', file);

        try {
            console.log('Uploading to: http://localhost:5000/predict/all');
            
            const response = await fetch('http://localhost:5000/predict/all', {
                method: 'POST',
                body: formData
            });

            if(!response.ok){
                const error = await response.json();
                throw new Error(error.error || `Server error: ${response.status}`);
            }

            const result = await response.json();
            console.log('Backend response:', result);

            if(result.error){
                throw new Error(result.error);
            }

            // Store results and image data
            sessionStorage.setItem('allResults', JSON.stringify(result));
            sessionStorage.setItem('uploadedImageData', imageData);
            
            // Update nav buttons with probabilities
            updateNavButtons(result.results);
            
            // Change upload prompt to success
            uploadPrompt.innerHTML = '<div style="font-size:18px; font-weight:600; color:#009966;">✅ Analysis Complete</div><p style="margin-top:10px;">Click on a disease button to view detailed results</p>';
            uploadPrompt.style.pointerEvents = 'auto';
            uploadPrompt.classList.remove('loading');
            analysisComplete = true;

        } catch(error){
            console.error('Upload error:', error);
            
            // Restore UI
            uploadPrompt.innerHTML = '<span class="tech-text">AI MEDICAL SYSTEM READY</span><p>UPLOAD MRI SCAN</p><small>Drop PNG / JPG / DICOM files or click to browse</small>';
            uploadPrompt.style.pointerEvents = 'auto';
            uploadPrompt.style.opacity = '1';
            uploadPrompt.classList.remove('loading');
            
            // Show error message
            alert(`❌ Error: ${error.message}\n\nMake sure the backend server is running on http://localhost:5000`);
        }
    };
    
    reader.readAsDataURL(file);
}

function updateNavButtons(results) {
    const navItems = document.querySelectorAll('.nav-item');
    
    // Tumor: sick_probability = 1 - probability_of_no_tumor
    if (results.tumor && !results.tumor.error) {
        const sickProb = Math.round(results.tumor.sick_probability * 100);
        navItems[0].innerHTML = `TUMOR DETECT<br><small style="font-size:12px; opacity:0.8;">${sickProb}% probability</small>`;
        navItems[0].style.background = sickProb > 50 ? 'rgba(255, 0, 0, 0.1)' : 'rgba(0, 150, 102, 0.1)';
        navItems[0].title = `Disease probability: ${sickProb}% (1 - probability of being normal)`;
    }
    
    // Stroke: sick_probability = 1 - probability_of_no_stroke
    if (results.stroke && !results.stroke.error) {
        const sickProb = Math.round(results.stroke.sick_probability * 100);
        navItems[1].innerHTML = `STROKE DETECT<br><small style="font-size:12px; opacity:0.8;">${sickProb}% probability</small>`;
        navItems[1].style.background = sickProb > 50 ? 'rgba(255, 0, 0, 0.1)' : 'rgba(0, 150, 102, 0.1)';
        navItems[1].title = `Disease probability: ${sickProb}% (1 - probability of being normal)`;
    }
    
    // Alzheimer: sick_probability = 1 - probability_of_no_impairment
    if (results.alzheimer && !results.alzheimer.error) {
        const sickProb = Math.round(results.alzheimer.sick_probability * 100);
        navItems[2].innerHTML = `ALZHEIMER DETECT<br><small style="font-size:12px; opacity:0.8;">${sickProb}% probability</small>`;
        navItems[2].style.background = sickProb > 50 ? 'rgba(255, 0, 0, 0.1)' : 'rgba(0, 150, 102, 0.1)';
        navItems[2].title = `Disease probability: ${sickProb}% (1 - probability of being normal)`;
    }
}

window.onload = function() {
    createParticles();
    
    // Check if we have previous results
    const allResults = JSON.parse(sessionStorage.getItem('allResults') || '{}');
    if (allResults.results) {
        updateNavButtons(allResults.results);
        uploadPrompt.innerHTML = '<div style="font-size:18px; font-weight:600; color:#009966;">✅ Analysis Complete</div><p style="margin-top:10px;">Click on a disease button to view detailed results</p>';
        uploadPrompt.style.pointerEvents = 'auto';
        analysisComplete = true;
    }
};
</script>

</body>
</html>
